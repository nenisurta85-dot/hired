# If the site lives in a subfolder of the repository, set
# Base directory = timshvac-site in Netlify (Site configuration → Build & deploy).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # FORMSPREE_FORM_ID is set in the Netlify UI: Site configuration → Environment variables

# Pretty URLs: /index.html -> /
[build.processing.html]
  pretty_urls = true

# Netlify serves 404.html for missing pages automatically.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/style-guide.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Old Webflow URLs, if any. Example:
# [[redirects]]
#   from = "/post/*"
#   to = "/blog/:splat"
#   status = 301
